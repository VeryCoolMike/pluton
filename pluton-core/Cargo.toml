[package]
name = "pluton-core"
version = "0.1.0"
edition = "2024"

[dependencies]

# General
rand_core = "0.9.3"
once_cell = "1.21.3"
tokio = { version = "1.47.1", features = ["full"] }
rand = "0.8"
jiff = "0.2.28"

# Cryptography
aes-gcm = "0.10.3"
argon2 = "0.5.3"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
zeroize = "1.8.2"

# Account Management
confy = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = "3.16.1"
futures-util = { version = "0.3.31", features = ["sink"] }
chrono = "0.4.43"
anyhow = "1.0.100"

# Networking
reqwest = { version = "0.13.2", features = ["json", "multipart"] }
tokio-tungstenite = "0.28.0"
directories = "6.0.0"
