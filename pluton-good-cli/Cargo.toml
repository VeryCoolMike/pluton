[package]
name = "pluton-good-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
chrono = "0.4.42"
confy = "2.0.0"
crossterm = { version = "0.28", features = ["event-stream"] }
ed25519-dalek = "2.2.0"
futures-channel = "0.3.31"
futures-util = "0.3.31"
image = "0.25.10"
infer = "0.19.0"
mime_guess = "2.0.5"
pluton-core = { path = "../pluton-core/" }
ratatui = "0.29"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
unicode-width = "0.2"
